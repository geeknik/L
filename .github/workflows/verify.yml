name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install project-local environment
        run: |
          python -m pip install uv==0.13.7
          uv sync --locked
      - name: Select tested Rust with Clippy
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy
          rustup default 1.96.0
      - name: Audit locked Python dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/requirements-audit.txt"
          uv tool run pip-audit==2.10.1 --require-hashes --disable-pip --requirement "$RUNNER_TEMP/requirements-audit.txt"
      - name: Audit locked Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.0 --locked --root "$RUNNER_TEMP/audit-tools"
          "$RUNNER_TEMP/audit-tools/bin/cargo-audit" audit --file rust/Cargo.lock
      - name: Run all verification gates
        run: uv run --locked python scripts/verify.py
